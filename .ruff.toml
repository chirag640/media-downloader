# Ruff configuration for MediaDrop Studio
# See https://docs.astral.sh/ruff/configuration/

target-version = "py311"

# Enable lint rules
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "S",   # bandit security
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

# Ignore specific rules
lint.ignore = [
    "E501",  # line too long — we prefer readable code
    "E731",  # lambda assignments — acceptable in some cases
    "S101",  # assert allowed in tests
    "N818",  # exception name should be suffixed with Error
]

# Allow line length up to 120 characters
line-length = 120

# Formatting
[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# Per-file ignores
[lint.per-file-ignores]
"test_*.py" = ["S101", "PLR2004", "ARG001"]
"__init__.py" = ["F401"]
